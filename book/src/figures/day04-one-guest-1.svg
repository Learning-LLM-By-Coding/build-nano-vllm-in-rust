<title id="day04-one-guest-1-title">Stage 1: one card becomes a question, a topic card and a statement</title>
<desc id="day04-one-guest-1-desc">Guest 2&#x27;s [1, 8] prepped card goes through the q, k and v translators into a [1, 8] question (4 ears × 2) and a [1, 4] topic card and statement (2 shared pairs × 2).</desc>
