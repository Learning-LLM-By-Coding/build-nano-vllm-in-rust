<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 472" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="day03-cards-title day03-cards-desc" id="day03-cards-root">
<title id="day03-cards-title">Two twin guests get their cards ready</title>
<desc id="day03-cards-desc">ids [97, 97] are embedded into a [2, 8] grid of cards, rmsnorm keeps [2, 8], linear re-mixes to [2, 4], and rope keeps [2, 4] while winding in the seat numbers.</desc>
<defs>
      <style>#day03-cards-root { --color-paper: #ffffff;
      --color-ink: #111111;
      --color-muted: #3d3d3d;
      --font-sans: 'Geist', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
      --font-mono: 'Geist Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
      #day03-cards-root { font-family: var(--font-sans); color: var(--color-ink); }
      #day03-cards-root .diagram-container { width: 100%; overflow-x: auto; }
      #day03-cards-root .caption { font-size: 0.9rem; color: var(--color-muted); margin-bottom: 1.2rem; line-height: 1.45; }
      @media print {
#day03-cards-root .diagram-container { overflow-x: visible; }
}</style>
