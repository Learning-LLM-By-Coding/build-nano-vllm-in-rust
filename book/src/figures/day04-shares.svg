<svg viewBox="0 0 720 284" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="day04-shares-title day04-shares-desc" id="day04-shares-root">
<title id="day04-shares-title">Ear 0&#x27;s shares for all three guests</title>
<desc id="day04-shares-desc">Guest 0 hears only itself (1.00); guest 1 splits 0.27 and 0.73 with guest 2 masked; guest 2 splits 0.21, 0.21 and 0.58. Every cell above the diagonal is the masked future.</desc>
<defs>
      <style>#day04-shares-root { --color-paper: #ffffff;
      --color-ink: #111111;
      --color-muted: #3d3d3d;
      --font-sans: 'Geist', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
      --font-mono: 'Geist Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
      #day04-shares-root { font-family: var(--font-sans); color: var(--color-ink); }
      #day04-shares-root .diagram-container { width: 100%; overflow-x: auto; }
      #day04-shares-root .caption { font-size: 0.9rem; color: var(--color-muted); margin-bottom: 1.2rem; line-height: 1.45; }
      @media print {
#day04-shares-root .diagram-container { overflow-x: visible; }
}</style>
