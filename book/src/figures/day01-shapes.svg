<text x="236" y="168.5" font-size="17" fill="#111111" font-family="'Geist Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">[1, 256]</text>
<text x="384" y="168.5" font-size="16" fill="#3d3d3d" font-family="'Geist', 'Helvetica Neue', Helvetica, Arial, sans-serif"><tspan font-family="'Geist Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-style="normal">f32</tspan>, one-hot of the LAST id (105)</text>
<line x1="24" y1="185" x2="696" y2="185" stroke="#8c8c8c" stroke-width="1"/>
<rect x="112" y="197.0" width="96" height="96" fill="#ececec" stroke="#111111" stroke-width="1.2"/>
<text x="24" y="251.0" font-size="17" fill="#111111" font-family="'Geist', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600">weights</text>
<text x="236" y="251.0" font-size="17" fill="#111111" font-family="'Geist Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">[256, 256]</text>
<text x="384" y="251.0" font-size="16" fill="#3d3d3d" font-family="'Geist', 'Helvetica Neue', Helvetica, Arial, sans-serif"><tspan font-family="'Geist Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-style="normal">f32</tspan>, the toy model</text>
<line x1="24" y1="305" x2="696" y2="305" stroke="#8c8c8c" stroke-width="1"/>
<rect x="112" y="333.0" width="96" height="10" fill="#111111" stroke="#111111" stroke-width="1.2"/>
<text x="24" y="344.0" font-size="17" fill="#111111" font-family="'Geist', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600">logits</text>
<text x="236" y="344.0" font-size="17" fill="#111111" font-family="'Geist Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">[1, 256]</text>
<text x="384" y="333.5" font-size="16" fill="#3d3d3d" font-family="'Geist', 'Helvetica Neue', Helvetica, Arial, sans-serif"><tspan font-family="'Geist Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-style="normal">f32</tspan>   (<tspan font-family="'Geist Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-style="normal">[1, 256] x [256, 256]</tspan></text>
<text x="384" y="354.5" font-size="16" fill="#3d3d3d" font-family="'Geist', 'Helvetica Neue', Helvetica, Arial, sans-serif"><tspan font-family="'Geist Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-style="normal">-&gt; inner 256s cancel</tspan>)</text>
<line x1="24" y1="371" x2="696" y2="371" stroke="#8c8c8c" stroke-width="1"/>
<rect x="112" y="383.5" width="20" height="20" fill="#111111" stroke="#111111" stroke-width="1.2"/>
<text x="24" y="399.5" font-size="17" fill="#111111" font-family="'Geist', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600">next</text>
<text x="236" y="399.5" font-size="17" fill="#111111" font-family="'Geist Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">106</text>
<text x="384" y="399.5" font-size="16" fill="#3d3d3d" font-family="'Geist', 'Helvetica Neue', Helvetica, Arial, sans-serif">a single <tspan font-family="'Geist Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-style="normal">u32</tspan>, chosen by argmax</text>
<line x1="24" y1="416" x2="696" y2="416" stroke="#8c8c8c" stroke-width="1"/>
<text x="24" y="442" font-size="16" fill="#575757" font-family="'Geist', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">glyphs: a long bar is 256 numbers, a small square is one number</text>
</svg>
