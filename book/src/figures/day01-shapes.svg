<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 464" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="day01-shapes-title day01-shapes-desc" id="day01-shapes-root">
<title id="day01-shapes-title">Shapes through Day 1&#x27;s pipeline</title>
<desc id="day01-shapes-desc">The text &quot;hi&quot; is 2 bytes, then ids [104, 105], a one-hot input [1, 256], weights [256, 256], logits [1, 256], and the single next id 106.</desc>
<defs>
      <style>#day01-shapes-root { --color-paper: #ffffff;
      --color-ink: #111111;
      --color-muted: #3d3d3d;
      --font-sans: 'Geist', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
      --font-mono: 'Geist Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
      #day01-shapes-root { font-family: var(--font-sans); color: var(--color-ink); }
      #day01-shapes-root .diagram-container { width: 100%; overflow-x: auto; }
      #day01-shapes-root .caption { font-size: 0.9rem; color: var(--color-muted); margin-bottom: 1.2rem; line-height: 1.45; }
      @media print {
#day01-shapes-root .diagram-container { overflow-x: visible; }
}</style>
  <marker id="day01-shapes-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 10 4, 0 8" fill="#575757"/></marker>
  <marker id="day01-shapes-arrow-accent" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 12 5, 0 10" fill="#111111"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="38" font-size="16" fill="#3d3d3d" font-family="'Geist', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600">stage</text>
<text x="112" y="38" font-size="16" fill="#3d3d3d" font-family="'Geist', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600">shape</text>
<text x="236" y="38" font-size="16" fill="#3d3d3d" font-family="'Geist', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600">value</text>
<text x="384" y="38" font-size="16" fill="#3d3d3d" font-family="'Geist', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600">what it is</text>
<line x1="24" y1="50" x2="696" y2="50" stroke="#8c8c8c" stroke-width="1"/>
<rect x="112" y="62.5" width="20" height="20" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
<rect x="136" y="62.5" width="20" height="20" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
<text x="24" y="78.5" font-size="17" fill="#111111" font-family="'Geist Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="600">&quot;hi&quot;</text>
<text x="384" y="78.5" font-size="16" fill="#3d3d3d" font-family="'Geist', 'Helvetica Neue', Helvetica, Arial, sans-serif">2 bytes</text>
<line x1="24" y1="95" x2="696" y2="95" stroke="#8c8c8c" stroke-width="1"/>
<rect x="112" y="107.5" width="20" height="20" fill="#ececec" stroke="#111111" stroke-width="1.2"/>
<rect x="136" y="107.5" width="20" height="20" fill="#ececec" stroke="#111111" stroke-width="1.2"/>
<text x="24" y="123.5" font-size="17" fill="#111111" font-family="'Geist', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600">ids</text>
<text x="236" y="123.5" font-size="17" fill="#111111" font-family="'Geist Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">[104, 105]</text>
<text x="384" y="123.5" font-size="16" fill="#3d3d3d" font-family="'Geist', 'Helvetica Neue', Helvetica, Arial, sans-serif">plain <tspan font-family="'Geist Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-style="normal">Vec&lt;u32&gt;</tspan>, not a tensor yet</text>
<line x1="24" y1="140" x2="696" y2="140" stroke="#8c8c8c" stroke-width="1"/>
<rect x="112" y="157.5" width="96" height="10" fill="#cfcfcf" stroke="#111111" stroke-width="1.2"/>
