<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 680.0" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="day05-block-flow-title day05-block-flow-desc" id="day05-block-flow-root">
<title id="day05-block-flow-title">One block: two activities, each penciled onto the card</title>
<desc id="day05-block-flow-desc">A [3, 8] card goes through a volume knob and the conversation, whose notes are added onto the card, then a second knob and the Mlp, whose conclusions are added too, leaving a [3, 8] card.</desc>
<defs>
      <style>#day05-block-flow-root { --color-paper: #ffffff;
      --color-ink: #111111;
      --color-muted: #3d3d3d;
      --font-sans: 'Geist', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
      --font-mono: 'Geist Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
      #day05-block-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #day05-block-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      #day05-block-flow-root .caption { font-size: 0.9rem; color: var(--color-muted); margin-bottom: 1.2rem; line-height: 1.45; }
      @media print {
#day05-block-flow-root .diagram-container { overflow-x: visible; }
}</style>
  <marker id="day05-block-flow-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 10 4, 0 8" fill="#575757"/></marker>
  <marker id="day05-block-flow-arrow-accent" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 12 5, 0 10" fill="#111111"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
